name: M3 samples finalize

on:
  push:
    branches:
      - feat/m3-png-rgba-normalization

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-png-rgba-normalization
          fetch-depth: 0
      - name: Use latest branch after initial verifier
        shell: bash
        run: |
          sleep 90
          git fetch origin feat/m3-png-rgba-normalization
          git reset --hard origin/feat/m3-png-rgba-normalization
      - name: Apply bootstrap wiring if it has not been committed
        shell: bash
        run: |
          if test -f .github/workflows/m3-samples-bootstrap.yml; then
            python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m3-samples-bootstrap.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'm3-samples-bootstrap-embedded', 'exec'))
          PY
          fi
      - name: Verify complete sample normalization
        shell: bash
        run: |
          cargo fmt --all
          python3 tools/generate_e2e_fixtures.py --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked -p sightlint-cli --test e2e
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/m3-samples-bootstrap.yml
          rm -f .github/workflows/m3-samples-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: normalize PNG samples to encoded RGBA8'
          git push origin HEAD:feat/m3-png-rgba-normalization
