name: Evaluation Clippy bootstrap

on:
  push:
    branches:
      - feat/evaluation-corpus-foundation

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/evaluation-corpus-foundation
          fetch-depth: 0
      - name: Apply lint repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/sightlint-cli/tests/evaluation_corpus.rs')
          text = path.read_text()
          for old, new in [
              ('mutant_case_id', 'mutant'),
              ('baseline_case_id', 'baseline'),
              ('target_rule_id', 'target_rule'),
          ]:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'identifier marker not found: {old}')
              text = text.replace(old, new)

          old = "fn array<'a>(value: &'a Value, context: &str) -> &'a [Value] {\n    value\n        .as_array()\n        .map(Vec::as_slice)\n        .unwrap_or_else(|| panic!(\"{context} must be a JSON array\"))\n}"
          new = "fn array<'a>(value: &'a Value, context: &str) -> &'a [Value] {\n    value\n        .as_array()\n        .map_or_else(|| panic!(\"{context} must be a JSON array\"), Vec::as_slice)\n}"
          if text.count(old) != 1:
              raise SystemExit(f'array helper marker mismatch: {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and verify
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          cargo +stable fmt --all
          cargo +stable clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +stable test --locked --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo +stable doc --locked --workspace --all-features --no-deps
      - name: Commit verified repair
        shell: bash
        run: |
          rm .github/workflows/evaluation-clippy-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make product evaluation runner Clippy-clean'
          git push origin HEAD:feat/evaluation-corpus-foundation
