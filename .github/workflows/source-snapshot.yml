name: Source snapshot

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-patch:
    if: >-
      github.repository == 'taro-28/sightlint' &&
      github.actor == 'taro-28' &&
      github.head_ref == 'feat/m2-visual-geometry-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='9a6373d73d12fb77a650cb015fef835c42ba45c8'
          actual_blob="$(git hash-object .github/m2.patch.xz)"
          test "$actual_blob" = "$expected_blob"
          xz -dc .github/m2.patch.xz > /tmp/m2.patch
          printf '%s  %s\n' 'f0344385aec4a093987c2ee59dd6aceb5b308ec82ec93f6b89f8683b22790267' /tmp/m2.patch | sha256sum --check --status
          git apply --check --verbose /tmp/m2.patch
          git apply /tmp/m2.patch
          python3 tools/generate_e2e_fixtures.py
          python3 tools/generate_e2e_fixtures.py --check
          cargo fmt --all
      - name: Commit implementation and fixtures
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows/ci.yml
          rm -f .github/m2.patch.xz
          rm -f .github/m2-payload.part* .github/tmp/m2-payload.*
          rmdir .github/tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement M2 visual geometry rules and E2E corpus'
          git fetch --unshallow origin 2>/dev/null || true
          git fetch origin "+refs/heads/${{ github.head_ref }}:refs/remotes/origin/${{ github.head_ref }}"
          git push --no-thin origin HEAD:refs/heads/${{ github.head_ref }}
