name: Source snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'feat/m2-visual-geometry-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package source
        shell: bash
        run: tar --exclude=.git --exclude=target -czf /tmp/sightlint-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sightlint-m2-source
          path: /tmp/sightlint-source.tar.gz
          if-no-files-found: error
          retention-days: 1
