name: Fix M2 Clippy

on:
  push:
    branches:
      - feat/m2-visual-geometry-rules

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m2-visual-geometry-rules
      - name: Replace strict float assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sightlint-engine/src/visual_rules.rs')
          text = path.read_text()
          old = '''        assert_eq!(\n            alignment_coordinate(\n                rect,\n                sightlint_ir::Axis::Horizontal,\n                sightlint_ir::AlignmentAnchor::Start\n            ),\n            100.0\n        );\n'''
          new = '''        let coordinate = alignment_coordinate(\n            rect,\n            sightlint_ir::Axis::Horizontal,\n            sightlint_ir::AlignmentAnchor::Start,\n        );\n        assert!((coordinate - 100.0).abs() < f64::EPSILON);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Verify formatting and Clippy
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-m2-clippy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: avoid strict float comparison in RTL alignment assertion'
          git push origin HEAD:feat/m2-visual-geometry-rules
