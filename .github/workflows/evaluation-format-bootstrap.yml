name: Evaluation format bootstrap

on:
  push:
    branches:
      - feat/evaluation-corpus-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/evaluation-corpus-foundation
          fetch-depth: 0
      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format and commit
        shell: bash
        run: |
          cargo +stable fmt --all
          rm .github/workflows/evaluation-format-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: format product evaluation runner'
          git push origin HEAD:feat/evaluation-corpus-foundation
