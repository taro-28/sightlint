name: Workspace bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    name: Apply canonical generated workspace state
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install minimum and stable Rust tooling
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply reviewed source corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          model = Path("crates/sightlint-ir/src/model.rs")
          text = model.read_text(encoding="utf-8")
          old = '#[serde(tag = "type", rename_all = "camelCase", deny_unknown_fields)]'
          new = '#[serde(tag = "type", rename_all = "camelCase", rename_all_fields = "camelCase", deny_unknown_fields)]'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit("expected serde enum contract was not found")
          model.write_text(text, encoding="utf-8", newline="\n")

          rules = Path("crates/sightlint-engine/src/rules.rs")
          text = rules.read_text(encoding="utf-8")
          text = text.replace(
              "QueryContext, QueryError, ensure_comparable, ordered_gap, overlap_extents, within_canvas,",
              "QueryContext, ensure_comparable, ordered_gap, overlap_extents, within_canvas,",
          )
          text = text.replace(
              "\nfn _query_error_is_exhaustive(error: QueryError) -> String {\n    error.to_string()\n}\n",
              "\n",
          )
          rules.write_text(text, encoding="utf-8", newline="\n")
          PY
      - name: Generate and format canonical workspace state
        run: |
          cargo +1.85.0 generate-lockfile
          python3 tools/generate_e2e_fixtures.py
          cargo +stable fmt --all
      - name: Commit canonical workspace state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates fixtures
          if git diff --cached --quiet; then
            echo "Workspace already canonical"
          else
            git commit -m "fix: remove dead query compatibility shim"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
