name: Lockfile bootstrap

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Cargo.lock for review branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minimum Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Generate and print lockfile
        shell: bash
        run: |
          cargo +1.85.0 generate-lockfile
          echo 'SIGHTLINT_LOCKFILE_BEGIN'
          base64 -w0 Cargo.lock
          echo
          echo 'SIGHTLINT_LOCKFILE_END'
