name: Workspace bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    name: Apply canonical generated workspace state
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install minimum and stable Rust tooling
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup toolchain install stable --profile minimal --component rustfmt
      - name: Generate and format canonical workspace state
        run: |
          cargo +1.85.0 generate-lockfile
          python3 tools/generate_e2e_fixtures.py
          cargo +stable fmt --all
      - name: Commit canonical workspace state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock crates fixtures
          if git diff --cached --quiet; then
            echo "Workspace already canonical"
          else
            git commit -m "chore: apply canonical generated workspace state"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
