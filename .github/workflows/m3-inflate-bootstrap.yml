name: M3 inflate bootstrap

on:
  push:
    branches:
      - feat/m3-bounded-png-inflate

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-bounded-png-inflate
          fetch-depth: 0
      - name: Wire bounded inflation and valid PNG fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/sightlint-adapter-png/src/lib.rs')
          text = lib.read_text()
          replacements = [
              (
                  '//! This crate deliberately inspects only the PNG signature and `IHDR` chunk. It does not decode\n//! pixel samples and therefore does not infer ink bounds, text, components, or semantic roles.',
                  '//! This crate validates PNG metadata, the complete chunk stream, and bounded zlib inflation.\n//! Inflated bytes remain PNG-filtered; the adapter does not yet derive pixel colors, ink bounds,\n//! text, components, or semantic roles.',
              ),
              (
                  'mod structure;\n\npub use structure::{PngStructure, PngStructureError, inspect_png_structure};',
                  'mod inflate;\nmod structure;\n\npub use inflate::{InflatedPng, PngInflateError, expected_scanline_bytes, inflate_png_scanlines};\npub use structure::{PngStructure, PngStructureError, inspect_png_structure};',
              ),
              (
                  '    /// The adapter produced IR that violates the current core contract.\n    InvalidArtifactIr(String),',
                  '    /// The PNG chunk stream is valid but its compressed image data is not.\n    InvalidImageData(PngInflateError),\n    /// The adapter produced IR that violates the current core contract.\n    InvalidArtifactIr(String),',
              ),
              (
                  '            Self::InvalidStructure(error) => error.fmt(formatter),\n            Self::InvalidArtifactIr(message) => {',
                  '            Self::InvalidStructure(error) => error.fmt(formatter),\n            Self::InvalidImageData(error) => error.fmt(formatter),\n            Self::InvalidArtifactIr(message) => {',
              ),
              (
                  'pub fn adapt_png(input: &[u8], source_name: Option<String>) -> Result<ArtifactIr, PngAdapterError> {\n    let structure = inspect_png_structure(input)?;\n    let header = structure.header;',
                  'pub fn adapt_png(input: &[u8], source_name: Option<String>) -> Result<ArtifactIr, PngAdapterError> {\n    let inflated = inflate_png_scanlines(input)?;\n    let structure = inflated.structure;\n    let inflated_scanline_bytes = inflated.scanline_bytes.len();\n    let header = structure.header;',
              ),
              (
                  '            "idatBytes": structure.idat_bytes,\n            "hasPalette": structure.has_palette\n',
                  '            "idatBytes": structure.idat_bytes,\n            "hasPalette": structure.has_palette,\n            "inflatedScanlineBytes": inflated_scanline_bytes\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'lib replacement expected once, found {count}: {old!r}')
              text = text.replace(old, new)

          test_marker = '    fn append_chunk(bytes: &mut Vec<u8>, kind: [u8; 4], data: &[u8]) {'
          test_helpers = '''    fn adler32(bytes: &[u8]) -> u32 {\n        const MOD_ADLER: u32 = 65_521;\n        let mut a = 1_u32;\n        let mut b = 0_u32;\n        for &byte in bytes {\n            a = (a + u32::from(byte)) % MOD_ADLER;\n            b = (b + a) % MOD_ADLER;\n        }\n        (b << 16) | a\n    }\n\n    fn zlib_stored(bytes: &[u8]) -> Vec<u8> {\n        let mut output = vec![0x78, 0x01];\n        if bytes.is_empty() {\n            output.extend_from_slice(&[0x01, 0x00, 0x00, 0xff, 0xff]);\n        } else {\n            let chunk_count = bytes.len().div_ceil(65_535);\n            for (index, chunk) in bytes.chunks(65_535).enumerate() {\n                output.push(u8::from(index + 1 == chunk_count));\n                let length = u16::try_from(chunk.len()).expect("stored block fits u16");\n                output.extend_from_slice(&length.to_le_bytes());\n                output.extend_from_slice(&(!length).to_le_bytes());\n                output.extend_from_slice(chunk);\n            }\n        }\n        output.extend_from_slice(&adler32(bytes).to_be_bytes());\n        output\n    }\n\n'''
          if text.count(test_marker) != 1:
              raise SystemExit('lib test helper marker mismatch')
          text = text.replace(test_marker, test_helpers + test_marker)
          old_adapt = '        let bytes = png_header(320, 200, 8, 6, 0, 0, 0);\n        let document = adapt_png(&bytes, Some("sample.png".to_owned())).expect("valid IR");'
          new_adapt = '''        let mut bytes = png_header(320, 200, 8, 6, 0, 0, 0);\n        bytes.truncate(33);\n        let decoded = vec![0_u8; 200 * (1 + 320 * 4)];\n        append_chunk(&mut bytes, *b"IDAT", &zlib_stored(&decoded));\n        append_chunk(&mut bytes, *b"IEND", &[]);\n        let document = adapt_png(&bytes, Some("sample.png".to_owned())).expect("valid IR");'''
          if text.count(old_adapt) != 1:
              raise SystemExit('lib adapt test marker mismatch')
          lib.write_text(text.replace(old_adapt, new_adapt))

          e2e = Path('crates/sightlint-cli/tests/png_e2e.rs')
          text = e2e.read_text()
          marker = 'fn append_chunk(bytes: &mut Vec<u8>, kind: [u8; 4], data: &[u8]) {'
          helpers = '''fn adler32(bytes: &[u8]) -> u32 {\n    const MOD_ADLER: u32 = 65_521;\n    let mut a = 1_u32;\n    let mut b = 0_u32;\n    for &byte in bytes {\n        a = (a + u32::from(byte)) % MOD_ADLER;\n        b = (b + a) % MOD_ADLER;\n    }\n    (b << 16) | a\n}\n\nfn zlib_stored(bytes: &[u8]) -> Vec<u8> {\n    let mut output = vec![0x78, 0x01];\n    if bytes.is_empty() {\n        output.extend_from_slice(&[0x01, 0x00, 0x00, 0xff, 0xff]);\n    } else {\n        let chunk_count = bytes.len().div_ceil(65_535);\n        for (index, chunk) in bytes.chunks(65_535).enumerate() {\n            output.push(u8::from(index + 1 == chunk_count));\n            let length = u16::try_from(chunk.len()).expect("stored block fits u16");\n            output.extend_from_slice(&length.to_le_bytes());\n            output.extend_from_slice(&(!length).to_le_bytes());\n            output.extend_from_slice(chunk);\n        }\n    }\n    output.extend_from_slice(&adler32(bytes).to_be_bytes());\n    output\n}\n\nfn channels(color_type: u8) -> Option<u64> {\n    match color_type {\n        0 | 3 => Some(1),\n        2 => Some(3),\n        4 => Some(2),\n        6 => Some(4),\n        _ => None,\n    }\n}\n\nfn pass_extent(size: u32, start: u32, step: u32) -> u32 {\n    if size <= start { 0 } else { 1 + (size - start - 1) / step }\n}\n\nfn expected_bytes(width: u32, height: u32, depth: u8, color_type: u8, interlace: u8) -> Option<usize> {\n    if width > 1_000 || height > 1_000 || interlace > 1 {\n        return None;\n    }\n    let bits = channels(color_type)? * u64::from(depth);\n    let pass = |w: u32, h: u32| -> u64 {\n        if w == 0 || h == 0 { 0 } else { u64::from(h) * (1 + (u64::from(w) * bits).div_ceil(8)) }\n    };\n    let total = if interlace == 0 {\n        pass(width, height)\n    } else {\n        [(0,0,8,8),(4,0,8,8),(0,4,4,8),(2,0,4,4),(0,2,2,4),(1,0,2,2),(0,1,1,2)]\n            .into_iter()\n            .map(|(sx, sy, dx, dy)| pass(pass_extent(width, sx, dx), pass_extent(height, sy, dy)))\n            .sum()\n    };\n    usize::try_from(total).ok()\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('png e2e helper marker mismatch')
          text = text.replace(marker, helpers + marker)
          old_idat = '    append_chunk(&mut bytes, *b"IDAT", &[]);\n    append_chunk(&mut bytes, *b"IEND", &[]);'
          new_idat = '''    let decoded = expected_bytes(width, height, bit_depth, color_type, interlace)\n        .map_or_else(Vec::new, |length| vec![0_u8; length]);\n    append_chunk(&mut bytes, *b"IDAT", &zlib_stored(&decoded));\n    append_chunk(&mut bytes, *b"IEND", &[]);'''
          if text.count(old_idat) != 1:
              raise SystemExit(f'png e2e IDAT marker mismatch: {text.count(old_idat)}')
          e2e.write_text(text.replace(old_idat, new_idat))

          structure = Path('crates/sightlint-cli/tests/png_structure_e2e.rs')
          text = structure.read_text()
          marker = 'fn append_chunk(bytes: &mut Vec<u8>, kind: [u8; 4], data: &[u8]) {'
          helpers = '''fn adler32(bytes: &[u8]) -> u32 {\n    const MOD_ADLER: u32 = 65_521;\n    let mut a = 1_u32;\n    let mut b = 0_u32;\n    for &byte in bytes {\n        a = (a + u32::from(byte)) % MOD_ADLER;\n        b = (b + a) % MOD_ADLER;\n    }\n    (b << 16) | a\n}\n\nfn zlib_stored(bytes: &[u8]) -> Vec<u8> {\n    let mut output = vec![0x78, 0x01];\n    let chunk_count = bytes.len().div_ceil(65_535);\n    if bytes.is_empty() {\n        output.extend_from_slice(&[0x01, 0x00, 0x00, 0xff, 0xff]);\n    } else {\n        for (index, chunk) in bytes.chunks(65_535).enumerate() {\n            output.push(u8::from(index + 1 == chunk_count));\n            let length = u16::try_from(chunk.len()).expect("stored block fits u16");\n            output.extend_from_slice(&length.to_le_bytes());\n            output.extend_from_slice(&(!length).to_le_bytes());\n            output.extend_from_slice(chunk);\n        }\n    }\n    output.extend_from_slice(&adler32(bytes).to_be_bytes());\n    output\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('structure e2e helper marker mismatch')
          text = text.replace(marker, helpers + marker)
          text = text.replace('    append_chunk(&mut bytes, *b"IDAT", &[1, 2, 3]);', '    append_chunk(&mut bytes, *b"IDAT", &zlib_stored(&vec![0_u8; 198]));')
          old_complete = '''    append_chunk(&mut png, *b"IDAT", &[1, 2]);\n    append_chunk(&mut png, *b"IDAT", &[3, 4, 5]);'''
          new_complete = '''    let compressed = zlib_stored(&vec![0_u8; 54]);\n    let split = compressed.len() / 2;\n    append_chunk(&mut png, *b"IDAT", &compressed[..split]);\n    append_chunk(&mut png, *b"IDAT", &compressed[split..]);'''
          if text.count(old_complete) != 1:
              raise SystemExit('structure complete marker mismatch')
          text = text.replace(old_complete, new_complete)
          old_ancillary = '''    append_chunk(&mut png, *b"vpAg", &[9, 8, 7]);\n    append_chunk(&mut png, *b"IDAT", &[]);'''
          new_ancillary = '''    append_chunk(&mut png, *b"vpAg", &[9, 8, 7]);\n    append_chunk(&mut png, *b"IDAT", &zlib_stored(&vec![0_u8; 198]));'''
          if text.count(old_ancillary) != 1:
              raise SystemExit('structure ancillary marker mismatch')
          text = text.replace(old_ancillary, new_ancillary)
          old_limit = '''    append_chunk(&mut at_limit, *b"IDAT", &[]);\n    append_chunk(&mut at_limit, *b"IEND", &[]);'''
          new_limit = '''    append_chunk(&mut at_limit, *b"IDAT", &zlib_stored(&vec![0_u8; 198]));\n    append_chunk(&mut at_limit, *b"IEND", &[]);'''
          if text.count(old_limit) != 1:
              raise SystemExit('structure limit marker mismatch')
          structure.write_text(text.replace(old_limit, new_limit))

          decisions = Path('docs/decisions/README.md')
          text = decisions.read_text()
          marker = '- [0022 — Bounded full-stream PNG chunk validation](0022-bounded-png-chunk-validation.md)\n'
          addition = marker + '- [0023 — Bounded PNG IDAT inflation](0023-bounded-png-idat-inflate.md)\n'
          if text.count(marker) != 1:
              raise SystemExit('ADR index marker mismatch')
          decisions.write_text(text.replace(marker, addition))
          PY
      - name: Lock and verify implementation
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/m3-inflate-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: require bounded PNG IDAT inflation'
          git push origin HEAD:feat/m3-bounded-png-inflate
