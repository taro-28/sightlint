name: M3 inflate format final

on:
  push:
    branches:
      - feat/m3-bounded-png-inflate

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-bounded-png-inflate
          fetch-depth: 0
      - name: Format and verify final branch
        shell: bash
        run: |
          cargo fmt --all
          python3 tools/generate_e2e_fixtures.py --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked -p sightlint-cli --test e2e
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified formatting and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/m3-inflate-format-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
          else
            git commit -m 'style: finalize bounded PNG inflate implementation'
            git push origin HEAD:feat/m3-bounded-png-inflate
          fi
