name: M3 inflate review fixes

on:
  push:
    branches:
      - feat/m3-bounded-png-inflate

permissions:
  contents: write

jobs:
  review-fixes:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-bounded-png-inflate
          fetch-depth: 0
      - name: Apply API, contract, and interoperability fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/sightlint-adapter-png/src/lib.rs')
          text = lib.read_text()
          old = 'pub use inflate::{InflatedPng, PngInflateError, expected_scanline_bytes, inflate_png_scanlines};'
          new = 'pub use inflate::{InflatedPng, PngInflateError, inflate_png_scanlines};'
          if text.count(old) != 1:
              raise SystemExit(f'lib export marker mismatch: {text.count(old)}')
          lib.write_text(text.replace(old, new))

          inflate = Path('crates/sightlint-adapter-png/src/inflate.rs')
          text = inflate.read_text()
          old = 'pub fn expected_scanline_bytes(header: PngHeader) -> u64 {'
          new = 'pub(crate) fn expected_scanline_bytes(header: PngHeader) -> u64 {'
          if text.count(old) != 1:
              raise SystemExit(f'inflate visibility marker mismatch: {text.count(old)}')
          inflate.write_text(text.replace(old, new))

          adr = Path('docs/decisions/0023-bounded-png-idat-inflate.md')
          text = adr.read_text()
          old = '- allocate no more than the exact expected scanline byte count;'
          new = '- allocate the exact expected scanline byte count plus at most one sentinel byte used only to detect decoded overflow;'
          if text.count(old) != 1:
              raise SystemExit(f'ADR allocation marker mismatch: {text.count(old)}')
          adr.write_text(text.replace(old, new))

          e2e = Path('crates/sightlint-cli/tests/png_inflate_e2e.rs')
          text = e2e.read_text()
          marker = '#[test]\nfn accepts_exact_zlib_scanline_lengths_and_split_idat() {'
          addition = r'''// Generated independently with Python's zlib.compress(..., level=6). These vectors exercise
// fixed and dynamic Huffman DEFLATE blocks rather than SightLint's stored-block test encoder.
const PYTHON_ZLIB_FIXED_RGBA_3X2: &[u8] = &[
    0x78, 0x9c, 0x63, 0x60, 0xc0, 0x05, 0x00, 0x00, 0x1a, 0x00, 0x01,
];
const PYTHON_ZLIB_DYNAMIC_RGBA_64X64: &[u8] = &[
    0x78, 0x9c, 0xed, 0xc1, 0x01, 0x0d, 0x00, 0x00, 0x00, 0xc2, 0xa0, 0xf7, 0x4f,
    0x6d, 0x0e, 0x37, 0xa0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
    0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x80, 0x77, 0x03, 0x40, 0x40, 0x00,
    0x01,
];

#[test]
fn accepts_independent_fixed_and_dynamic_huffman_zlib_streams() {
    for (width, height, compressed) in [
        (3_u32, 2_u32, PYTHON_ZLIB_FIXED_RGBA_3X2),
        (64_u32, 64_u32, PYTHON_ZLIB_DYNAMIC_RGBA_64X64),
    ] {
        let mut png = header_prefix(width, height, 8, 6, 0);
        append_chunk(&mut png, *b"IDAT", compressed);
        append_chunk(&mut png, *b"IEND", &[]);

        let output = run_stdin(&["adapt-image", "-"], &png);
        assert_eq!(
            output.status.code(),
            Some(EXIT_SUCCESS),
            "{}",
            String::from_utf8_lossy(&output.stderr)
        );
        let ir: Value = serde_json::from_slice(&output.stdout).expect("canonical IR JSON");
        assert_eq!(
            ir["extensions"]["org.sightlint.adapter.png"]["inflatedScanlineBytes"],
            expected_bytes(width, height, 8, 6, 0)
        );
    }
}

'''
          if text.count(marker) != 1:
              raise SystemExit(f'E2E insertion marker mismatch: {text.count(marker)}')
          e2e.write_text(text.replace(marker, addition + marker))
          PY
      - name: Verify final reviewed implementation
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified review fixes
        shell: bash
        run: |
          rm .github/workflows/m3-inflate-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: harden bounded PNG inflation interoperability'
          git push origin HEAD:feat/m3-bounded-png-inflate
