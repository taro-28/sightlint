name: Format review branch

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.repository == 'taro-28/sightlint' &&
      github.actor == 'taro-28' &&
      github.head_ref == 'feat/m2-visual-geometry-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install Rust formatter
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply rustfmt'
          git push origin HEAD:${{ github.head_ref }}
