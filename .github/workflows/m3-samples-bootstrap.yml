name: M3 samples bootstrap

on:
  push:
    branches:
      - feat/m3-png-rgba-normalization

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-png-rgba-normalization
          fetch-depth: 0
      - name: Verify prerequisite and wire sample normalization
        shell: bash
        run: |
          test -f crates/sightlint-adapter-png/src/filter.rs
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/sightlint-adapter-png/src/lib.rs')
          text = lib.read_text()
          replacements = [
              (
                  '//! This crate validates PNG metadata, the complete chunk stream, bounded zlib inflation,\n//! and deterministic scanline-filter reconstruction. Samples remain packed; the adapter does not\n//! yet derive pixel colors, ink bounds, text, components, or semantic roles.',
                  '//! This crate validates PNG metadata, the complete chunk stream, bounded zlib inflation,\n//! scanline-filter reconstruction, and deterministic expansion to PNG-encoded RGBA8. Color\n//! management, ink bounds, text, components, and semantic roles remain separate stages.',
              ),
              (
                  'mod filter;\nmod inflate;\nmod structure;',
                  'mod filter;\nmod inflate;\nmod samples;\nmod structure;',
              ),
              (
                  'pub use inflate::{InflatedPng, PngInflateError, expected_scanline_bytes, inflate_png_scanlines};\npub use structure::{PngStructure, PngStructureError, inspect_png_structure};',
                  'pub use inflate::{InflatedPng, PngInflateError, expected_scanline_bytes, inflate_png_scanlines};\npub use samples::{\n    NormalizedPng, PngColorDescription, PngSampleError, normalize_png_rgba8,\n};\npub use structure::{PngStructure, PngStructureError, inspect_png_structure};',
              ),
              (
                  '    /// Inflated scanlines contain an invalid filter selector or inconsistent layout.\n    InvalidFilterData(PngFilterError),\n    /// The adapter produced IR that violates the current core contract.',
                  '    /// Inflated scanlines contain an invalid filter selector or inconsistent layout.\n    InvalidFilterData(PngFilterError),\n    /// Reconstructed samples cannot be normalized under the PNG palette/transparency contract.\n    InvalidSampleData(PngSampleError),\n    /// The adapter produced IR that violates the current core contract.',
              ),
              (
                  '            Self::InvalidFilterData(error) => error.fmt(formatter),\n            Self::InvalidArtifactIr(message) => {',
                  '            Self::InvalidFilterData(error) => error.fmt(formatter),\n            Self::InvalidSampleData(error) => error.fmt(formatter),\n            Self::InvalidArtifactIr(message) => {',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'lib replacement expected once, found {count}: {old!r}')
              text = text.replace(old, new)

          old_adapt = '''pub fn adapt_png(input: &[u8], source_name: Option<String>) -> Result<ArtifactIr, PngAdapterError> {
    let reconstructed = reconstruct_png_filters(input)?;
    let structure = reconstructed.structure;
    let header = structure.header;
    let inflated_scanline_bytes = expected_scanline_bytes(header);
    let reconstructed_sample_bytes = reconstructed.packed_sample_bytes.len();
    let reconstructed_sample_crc32 = format!("{:08x}", reconstructed.packed_sample_crc32);
    let active_pass_count = reconstructed.passes.len();
    let scanline_count: u64 = reconstructed.filter_counts.iter().sum();
    let filter_counts = reconstructed.filter_counts;
    let pass_metadata: Vec<serde_json::Value> = reconstructed
        .passes
        .iter()
        .map(|pass| {'''
          new_adapt = '''pub fn adapt_png(input: &[u8], source_name: Option<String>) -> Result<ArtifactIr, PngAdapterError> {
    let normalized = normalize_png_rgba8(input)?;
    let reconstructed = &normalized.reconstructed;
    let structure = reconstructed.structure;
    let header = structure.header;
    let inflated_scanline_bytes = expected_scanline_bytes(header);
    let reconstructed_sample_bytes = reconstructed.packed_sample_bytes.len();
    let reconstructed_sample_crc32 = format!("{:08x}", reconstructed.packed_sample_crc32);
    let active_pass_count = reconstructed.passes.len();
    let scanline_count: u64 = reconstructed.filter_counts.iter().sum();
    let filter_counts = reconstructed.filter_counts;
    let rgba8_bytes = normalized.rgba8.len();
    let rgba8_crc32 = format!("{:08x}", normalized.rgba8_crc32);
    let color_description = normalized.color_description;
    let pass_metadata: Vec<serde_json::Value> = reconstructed
        .passes
        .iter()
        .map(|pass| {'''
          if text.count(old_adapt) != 1:
              raise SystemExit(f'adapt marker mismatch: {text.count(old_adapt)}')
          text = text.replace(old_adapt, new_adapt)

          old_metadata = '''            "filterCounts": {
                "none": filter_counts[0],
                "sub": filter_counts[1],
                "up": filter_counts[2],
                "average": filter_counts[3],
                "paeth": filter_counts[4]
            },
            "passes": pass_metadata
'''
          new_metadata = '''            "filterCounts": {
                "none": filter_counts[0],
                "sub": filter_counts[1],
                "up": filter_counts[2],
                "average": filter_counts[3],
                "paeth": filter_counts[4]
            },
            "passes": pass_metadata,
            "pixelEncoding": "pngEncodedRgba8",
            "colorManagementApplied": false,
            "rgba8Bytes": rgba8_bytes,
            "rgba8Crc32": rgba8_crc32,
            "opaquePixelCount": normalized.opaque_pixel_count,
            "transparentPixelCount": normalized.transparent_pixel_count,
            "translucentPixelCount": normalized.translucent_pixel_count,
            "paletteEntryCount": normalized.palette_entry_count,
            "transparencyEntryCount": normalized.transparency_entry_count,
            "unappliedColorDescriptionPresent": color_description.is_present(),
            "colorDescription": {
                "srgb": color_description.has_srgb,
                "gamma": color_description.has_gamma,
                "chromaticities": color_description.has_chromaticities,
                "iccProfile": color_description.has_icc_profile
            }
'''
          if text.count(old_metadata) != 1:
              raise SystemExit(f'metadata marker mismatch: {text.count(old_metadata)}')
          lib.write_text(text.replace(old_metadata, new_metadata))

          decisions = Path('docs/decisions/README.md')
          text = decisions.read_text()
          marker = '- [0024 — Deterministic PNG filter reconstruction](0024-png-filter-reconstruction.md)\n'
          addition = marker + '- [0025 — PNG encoded RGBA8 normalization](0025-png-encoded-rgba8-normalization.md)\n'
          if text.count(marker) != 1:
              raise SystemExit(f'ADR index marker mismatch: {text.count(marker)}')
          decisions.write_text(text.replace(marker, addition))

          readme = Path('README.md')
          text = readme.read_text()
          old = '''M3 now validates the complete PNG chunk stream, inflates `IDAT` within an exact decoded-size
budget, and reconstructs all five PNG scanline filters, including Adam7 pass boundaries. Samples
remain packed and no text, components, roles, pixel colors, ink bounds, or other semantics are
invented. Later pixel-analysis work builds on these verified parser boundaries rather than
bypassing them.'''
          new = '''M3 now validates the complete PNG chunk stream, inflates `IDAT` within an exact decoded-size
budget, reconstructs all five scanline filters, and expands packed samples, palettes, alpha, and
Adam7 passes into explicitly non-color-managed PNG-encoded RGBA8. No final display color, ink,
text, components, roles, or other semantics are invented. Later pixel analysis builds on these
verified parser boundaries rather than bypassing them.'''
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('README M3 marker not found')
          readme.write_text(text)
          PY
      - name: Verify complete sample normalization
        shell: bash
        run: |
          cargo fmt --all
          python3 tools/generate_e2e_fixtures.py --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked -p sightlint-cli --test e2e
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/m3-samples-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: normalize PNG samples to encoded RGBA8'
          git push origin HEAD:feat/m3-png-rgba-normalization
