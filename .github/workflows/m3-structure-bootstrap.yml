name: M3 structure bootstrap

on:
  push:
    branches:
      - feat/m3-png-structure-validation

permissions:
  contents: write

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-png-structure-validation
          fetch-depth: 0
      - name: Wire full-stream validation into adapter and fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('crates/sightlint-adapter-png/src/lib.rs')
          text = lib.read_text()
          replacements = [
              (
                  '#![forbid(unsafe_code)]\n\n',
                  '#![forbid(unsafe_code)]\n\nmod structure;\n\npub use structure::{PngStructure, PngStructureError, inspect_png_structure};\n\n',
              ),
              (
                  '    /// The adapter produced IR that violates the current core contract.\n    InvalidArtifactIr(String),',
                  '    /// The header is valid but the complete PNG chunk stream is not.\n    InvalidStructure(PngStructureError),\n    /// The adapter produced IR that violates the current core contract.\n    InvalidArtifactIr(String),',
              ),
              (
                  '            Self::InvalidArtifactIr(message) => {',
                  '            Self::InvalidStructure(error) => error.fmt(formatter),\n            Self::InvalidArtifactIr(message) => {',
              ),
              (
                  'pub fn adapt_png(input: &[u8], source_name: Option<String>) -> Result<ArtifactIr, PngAdapterError> {\n    let header = inspect_png_header(input)?;',
                  'pub fn adapt_png(input: &[u8], source_name: Option<String>) -> Result<ArtifactIr, PngAdapterError> {\n    let structure = inspect_png_structure(input)?;\n    let header = structure.header;',
              ),
              (
                  '            "interlaceMethod": header.interlace_method\n',
                  '            "interlaceMethod": header.interlace_method,\n            "chunkCount": structure.chunk_count,\n            "idatChunkCount": structure.idat_chunk_count,\n            "idatBytes": structure.idat_bytes,\n            "hasPalette": structure.has_palette\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'lib replacement expected once, found {count}: {old!r}')
              text = text.replace(old, new)

          marker = '    fn png_header(\n'
          helper = '''    fn append_chunk(bytes: &mut Vec<u8>, kind: [u8; 4], data: &[u8]) {\n        let length = u32::try_from(data.len()).expect("test chunk length fits u32");\n        bytes.extend_from_slice(&length.to_be_bytes());\n        bytes.extend_from_slice(&kind);\n        bytes.extend_from_slice(data);\n        let crc_start = bytes.len() - data.len() - 4;\n        let crc = crc32(&bytes[crc_start..]);\n        bytes.extend_from_slice(&crc.to_be_bytes());\n    }\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('unit png_header marker mismatch')
          text = text.replace(marker, helper + marker)
          unit_old_tail = '''        let crc = crc32(&bytes[12..29]);\n        bytes.extend_from_slice(&crc.to_be_bytes());\n        bytes\n    }\n'''
          unit_new_tail = '''        let crc = crc32(&bytes[12..29]);\n        bytes.extend_from_slice(&crc.to_be_bytes());\n        if color_type == 3 {\n            append_chunk(&mut bytes, *b"PLTE", &[0, 0, 0]);\n        }\n        append_chunk(&mut bytes, *b"IDAT", &[]);\n        append_chunk(&mut bytes, *b"IEND", &[]);\n        bytes\n    }\n'''
          if text.count(unit_old_tail) != 1:
              raise SystemExit(f'unit png tail mismatch: {text.count(unit_old_tail)}')
          lib.write_text(text.replace(unit_old_tail, unit_new_tail))

          e2e = Path('crates/sightlint-cli/tests/png_e2e.rs')
          text = e2e.read_text()
          marker = 'fn png_header(\n'
          helper = '''fn append_chunk(bytes: &mut Vec<u8>, kind: [u8; 4], data: &[u8]) {\n    let length = u32::try_from(data.len()).expect("test chunk length fits u32");\n    bytes.extend_from_slice(&length.to_be_bytes());\n    bytes.extend_from_slice(&kind);\n    bytes.extend_from_slice(data);\n    let crc_start = bytes.len() - data.len() - 4;\n    let crc = crc32(&bytes[crc_start..]);\n    bytes.extend_from_slice(&crc.to_be_bytes());\n}\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('e2e png_header marker mismatch')
          text = text.replace(marker, helper + marker)
          e2e_old_tail = '''    let crc = crc32(&bytes[12..29]);\n    bytes.extend_from_slice(&crc.to_be_bytes());\n    bytes\n}\n'''
          e2e_new_tail = '''    let crc = crc32(&bytes[12..29]);\n    bytes.extend_from_slice(&crc.to_be_bytes());\n    if color_type == 3 {\n        append_chunk(&mut bytes, *b"PLTE", &[0, 0, 0]);\n    }\n    append_chunk(&mut bytes, *b"IDAT", &[]);\n    append_chunk(&mut bytes, *b"IEND", &[]);\n    bytes\n}\n'''
          if text.count(e2e_old_tail) != 1:
              raise SystemExit(f'e2e png tail mismatch: {text.count(e2e_old_tail)}')
          e2e.write_text(text.replace(e2e_old_tail, e2e_new_tail))
          PY
      - name: Verify all current behavior
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified wiring and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/m3-structure-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: require bounded full-stream PNG validation'
          git push origin HEAD:feat/m3-png-structure-validation
