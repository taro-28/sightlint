name: M3 inflate repair

on:
  push:
    branches:
      - feat/m3-bounded-png-inflate

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-bounded-png-inflate
          fetch-depth: 0
      - name: Apply original wiring plus lint repairs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m3-inflate-bootstrap.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'm3-inflate-bootstrap-embedded', 'exec'))

          structure = Path('crates/sightlint-cli/tests/png_structure_e2e.rs')
          text = structure.read_text()
          text = text.replace('zlib_stored(&vec![0_u8; 198])', 'zlib_stored(&[0_u8; 198])')
          text = text.replace('zlib_stored(&vec![0_u8; 54])', 'zlib_stored(&[0_u8; 54])')
          structure.write_text(text)

          inflate_e2e = Path('crates/sightlint-cli/tests/png_inflate_e2e.rs')
          text = inflate_e2e.read_text()
          old = '        6 => 4,\n        _ => 1,\n'
          new = '        6 => 4,\n        _ => unreachable!("validated test color type"),\n'
          if text.count(old) != 1:
              raise SystemExit(f'inflate E2E channels marker mismatch: {text.count(old)}')
          inflate_e2e.write_text(text.replace(old, new))
          PY
      - name: Lock and verify implementation
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/m3-inflate-bootstrap.yml
          rm .github/workflows/m3-inflate-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: require bounded PNG IDAT inflation'
          git push origin HEAD:feat/m3-bounded-png-inflate
