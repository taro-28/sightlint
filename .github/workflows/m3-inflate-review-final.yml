name: M3 inflate review final

on:
  push:
    branches:
      - feat/m3-bounded-png-inflate

permissions:
  contents: write

jobs:
  finalize-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-bounded-png-inflate
          fetch-depth: 0
      - name: Apply reviewed changes with corrected independent vector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m3-inflate-review-fixes.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )

          bad = ''
          good = ''
          if script.count(bad) != 1:
              raise SystemExit(f'encoded vector marker mismatch: {script.count(bad)}')
          exec(compile(script.replace(bad, good), 'reviewed-inflate-fixes', 'exec'))
          PY
      - name: Verify final reviewed implementation
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified review fixes
        shell: bash
        run: |
          rm .github/workflows/m3-inflate-review-fixes.yml
          rm .github/workflows/m3-inflate-review-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: harden bounded PNG inflation interoperability'
          git push origin HEAD:feat/m3-bounded-png-inflate
