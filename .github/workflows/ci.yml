name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record tested commit and tree
        run: git log -1 --format='commit=%H tree=%T parents=%P'
      - name: Reject stale integration artifacts
        run: |
          test ! -e .github/workflows/m3-filter-bootstrap.yml
          test ! -e crates/sightlint-adapter-png/src/filter_next.rs
      - name: Install stable Rust
        id: toolchain
        if: ${{ !cancelled() }}
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - name: Verify committed E2E fixtures
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 tools/generate_e2e_fixtures.py --check
      - name: Verify GitHub Actions schemas and evaluation governance
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/generate_github_actions_schemas.py --check
          python3 tools/check_github_actions_evaluation.py
      - name: Verify committed PNG pixel corpus
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 tools/generate_raster_corpus.py --check
      - name: Verify committed source-alpha assets and evaluation contract
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/generate_alpha_assets.py --check
          python3 tools/check_alpha_evaluation.py
      - name: Verify PNG format-demand assessment
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 tools/check_png_format_demand.py
      - name: Verify committed image inspection corpus
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 tools/generate_inspection_corpus.py --check
      - name: Verify realistic Web evaluation corpus
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/check_web_evaluation.py
          python3 tools/check_web_evaluation_v1.py
      - name: Verify perception evaluation governance
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: python3 tools/check_perception_evaluation.py
      - name: Verify PPTX fixtures, evaluation governance, and parser units
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/generate_pptx_fixtures.py --check
          python3 tools/check_pptx_evaluation.py
          python3 -m unittest adapters/pptx/tests/test_adapter.py
      - name: Install and verify the locked PDF adapter dependency and evaluation
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 -m venv .venv-sightlint-pdf
          .venv-sightlint-pdf/bin/python -m pip install --disable-pip-version-check --require-hashes -r adapters/pdf/requirements.txt
          .venv-sightlint-pdf/bin/python -c 'import os,sys; print(os.path.dirname(sys.executable))' >> "$GITHUB_PATH"
          .venv-sightlint-pdf/bin/python tools/generate_pdf_fixtures.py --check
          .venv-sightlint-pdf/bin/python tools/check_pdf_evaluation.py
          .venv-sightlint-pdf/bin/python -m unittest adapters/pdf/tests/test_adapter.py
      - name: Verify Android capture fixtures and evaluation governance
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/generate_android_fixtures.py --check
          python3 tools/check_android_evaluation.py
          python3 -m py_compile adapters/android/sightlint_android.py
      - name: Verify iOS capture fixtures and evaluation governance
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/generate_ios_fixtures.py --check
          python3 tools/check_ios_evaluation.py
          python3 -m py_compile adapters/ios/sightlint_ios.py
      - name: Verify release and dependency-license contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          python3 tools/release.py validate-tag --tag v0.1.0-alpha.2
          python3 tools/check_dependency_licenses.py
          python3 -m unittest tools/test_release.py
      - name: Check formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --all -- --check
      - name: Run Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked --workspace --all-features
      - name: Run fixture-driven CLI E2E explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test e2e
      - name: Run GitHub Actions projection E2E explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test github_actions_e2e
      - name: Run GitHub Actions product evaluation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test github_actions_evaluation_e2e -- --nocapture
      - name: Exercise the read-only GitHub job-check integration
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: >-
          cargo run --quiet --locked -p sightlint-cli -- github-check
          evaluation/web/inputs/dashboard-peer-spacing-clean.json
          --format github-actions --write-step-summary
      - name: Run PNG filter CLI E2E explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test png_filter_e2e
      - name: Run PNG pixel-oracle corpus explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test png_raster_corpus -- --nocapture
      - name: Run realistic source-alpha evaluation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test alpha_geometry_evaluation_e2e -- --nocapture
      - name: Run native image inspection E2E explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test image_inspection_e2e -- --nocapture
      - name: Run image segmentation benchmark E2E explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test image_segmentation_benchmark_e2e -- --nocapture
      - name: Run product evaluation smoke corpus explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test evaluation_corpus
      - name: Run realistic Web evaluation foundation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test web_evaluation_corpus -- --nocapture
      - name: Run PPTX source-adapter evaluation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test pptx_evaluation_e2e -- --nocapture
      - name: Run PDF source-adapter evaluation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test pdf_evaluation_e2e -- --nocapture
      - name: Run Android capture-adapter evaluation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test android_evaluation_e2e -- --nocapture
      - name: Run iOS capture-adapter evaluation explicitly
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked -p sightlint-cli --test ios_evaluation_e2e -- --nocapture
      - name: Build documentation
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  web-adapter:
    name: Playwright Web adapter E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify hosted Node compatibility
        run: |
          node --version
          npm --version
          node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20 || major > 24) process.exit(1)'
      - name: Install locked adapter dependencies
        run: npm ci --ignore-scripts
        working-directory: adapters/playwright
      - name: Install locked perception wrapper
        run: npm ci --ignore-scripts
        working-directory: adapters/perception
      - name: Validate perception protocol and unit behavior
        run: npm run check
        working-directory: adapters/perception
      - name: Validate adapter contracts and unit behavior
        run: npm run check
        working-directory: adapters/playwright
      - name: Install the Playwright-pinned Chromium build
        run: npx playwright install --with-deps chromium
        working-directory: adapters/playwright
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build the public SightLint binary
        run: cargo build --locked -p sightlint-cli
      - name: Run perception process and binary E2E
        run: npm run test:e2e
        working-directory: adapters/perception
      - name: Run browser acquisition and binary E2E
        run: |
          npm run test:e2e
          npm run test:managed-e2e
        working-directory: adapters/playwright

  msrv:
    name: Minimum Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install minimum Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check workspace on MSRV
        run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  cross-platform:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
            pdf_python: .venv-sightlint-pdf/bin/python
          - os: macos-latest
            python: python3
            pdf_python: .venv-sightlint-pdf/bin/python
          - os: windows-latest
            python: python
            pdf_python: .venv-sightlint-pdf/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify hosted Node compatibility
        run: node -e 'const major = Number(process.versions.node.split(".")[0]); if (major < 20 || major > 24) process.exit(1)'
      - name: Install locked perception wrapper
        run: npm ci --ignore-scripts
        working-directory: adapters/perception
      - name: Install locked browser companion
        run: npm ci --ignore-scripts
        working-directory: adapters/playwright
      - name: Build the public SightLint binary
        run: cargo build --locked -p sightlint-cli
      - name: Install locked PDF parser dependency
        shell: bash
        run: |
          ${{ matrix.python }} -m venv .venv-sightlint-pdf
          "${{ matrix.pdf_python }}" -m pip install --disable-pip-version-check --require-hashes -r adapters/pdf/requirements.txt
          "${{ matrix.pdf_python }}" -c 'import os,sys; print(os.path.dirname(sys.executable))' >> "$GITHUB_PATH"
      - name: Verify PPTX fixture and evaluation contracts
        run: |
          ${{ matrix.python }} tools/generate_pptx_fixtures.py --check
          ${{ matrix.python }} tools/check_pptx_evaluation.py
          ${{ matrix.python }} -m unittest adapters/pptx/tests/test_adapter.py
      - name: Verify PDF fixture and evaluation contracts
        shell: bash
        run: |
          "${{ matrix.pdf_python }}" tools/generate_pdf_fixtures.py --check
          "${{ matrix.pdf_python }}" tools/check_pdf_evaluation.py
          "${{ matrix.pdf_python }}" -m unittest adapters/pdf/tests/test_adapter.py
      - name: Verify Android fixture and evaluation contracts
        run: |
          ${{ matrix.python }} tools/generate_android_fixtures.py --check
          ${{ matrix.python }} tools/check_android_evaluation.py
          ${{ matrix.python }} -m py_compile adapters/android/sightlint_android.py
      - name: Verify iOS fixture and evaluation contracts
        run: |
          ${{ matrix.python }} tools/generate_ios_fixtures.py --check
          ${{ matrix.python }} tools/check_ios_evaluation.py
          ${{ matrix.python }} -m py_compile adapters/ios/sightlint_ios.py
      - name: Verify GitHub Actions schemas and evaluation governance
        run: |
          ${{ matrix.python }} tools/generate_github_actions_schemas.py --check
          ${{ matrix.python }} tools/check_github_actions_evaluation.py
      - name: Run tests, including CLI E2E and product evaluation
        run: cargo test --workspace --all-features --locked
      - name: Run perception protocol and public-process E2E
        run: |
          npm run check
          npm run test:e2e
        working-directory: adapters/perception
      - name: Run managed process-tree lifecycle E2E
        run: npm run test:server-e2e
        working-directory: adapters/playwright
