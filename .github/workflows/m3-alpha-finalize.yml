name: M3 alpha finalize

on:
  push:
    branches:
      - feat/m3-png-alpha-observations

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/m3-png-alpha-observations
          fetch-depth: 0
      - name: Use latest branch after initial verifier
        shell: bash
        run: |
          sleep 105
          git fetch origin feat/m3-png-alpha-observations
          git reset --hard origin/feat/m3-png-alpha-observations
      - name: Apply bootstrap wiring if still pending
        shell: bash
        run: |
          if test -f .github/workflows/m3-alpha-bootstrap.yml; then
            python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/m3-alpha-bootstrap.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          embedded = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()
          )
          exec(compile(script, 'm3-alpha-bootstrap-embedded', 'exec'))
          PY
          fi
      - name: Fix empty-bounds eager evaluation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/sightlint-adapter-png/src/pixels.rs')
          text = path.read_text()
          old = '''    fn finish(self) -> Option<PixelRect> {
        self.populated.then_some(PixelRect {
            x: self.min_x,
            y: self.min_y,
            width: self.max_x - self.min_x + 1,
            height: self.max_y - self.min_y + 1,
        })
    }'''
          new = '''    fn finish(self) -> Option<PixelRect> {
        if self.populated {
            Some(PixelRect {
                x: self.min_x,
                y: self.min_y,
                width: self.max_x - self.min_x + 1,
                height: self.max_y - self.min_y + 1,
            })
        } else {
            None
        }
    }'''
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('bounds finish marker not found')
          PY
      - name: Apply machine-safe fixes and verify behavior
        shell: bash
        run: |
          cargo fmt --all
          cargo clippy --fix --allow-dirty --allow-staged --locked --workspace --all-targets --all-features -- -D warnings
          cargo fmt --all
          python3 tools/generate_e2e_fixtures.py --check
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo test --locked -p sightlint-cli --test e2e
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --all-features --no-deps
      - name: Commit verified implementation
        shell: bash
        run: |
          rm -f .github/workflows/m3-alpha-bootstrap.yml
          rm -f .github/workflows/m3-alpha-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: derive exact alpha-visible PNG geometry'
          git push origin HEAD:feat/m3-png-alpha-observations
