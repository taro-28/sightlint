name: Architecture decision
description: Propose a durable change to a project invariant or subsystem boundary
title: "adr: "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What durable problem or constraint requires a decision?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences and compatibility impact
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
    validations:
      required: true
